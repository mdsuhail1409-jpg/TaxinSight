services:
  - type: web
    name: taxinsight-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.database.seed_data"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./taxinsight.db
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://taxinsight.vercel.app"

