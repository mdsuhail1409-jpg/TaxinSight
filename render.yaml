services:
  - type: web
    name: taxinsight-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python app/database/seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./taxinsight.db
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://taxinsight.vercel.app,https://*.vercel.app"
